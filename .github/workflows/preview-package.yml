name: Temporary Framelet ad-hoc preview package
on:
  push:
    branches: [qa/framelet-preview-20261108-3]
    paths: [.github/workflows/preview-package.yml]
permissions:
  contents: read
concurrency:
  group: framelet-preview-20261108-3
  cancel-in-progress: false
jobs:
  package:
    if: >-
      github.repository == 'alvarovillalbaa/framelet' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/qa/framelet-preview-20261108-3'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      CI: 'true'
      SOURCE_COMMIT: 161214ab3d34314ecf9a52a5a2aef79e502a8480
    steps:
      - name: Record earliest job time
        shell: bash
        run: echo "FRAMELET_JOB_STARTED_MS=$(date +%s)000" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_COMMIT }}
          fetch-depth: 4
          persist-credentials: false
          clean: false
      - name: Package and inspect without launching the application or tests
        shell: bash
        run: python3 -I -B -S Tests/ci/run-preview-package.py --source-commit "$SOURCE_COMMIT"
